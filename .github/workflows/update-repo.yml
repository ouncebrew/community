name: Update repo.json from package.json

on:
  schedule:
    - cron: "0 19 * * *" # Daily at 19:00 UTC (7:00 PM UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update repo.json
        run: python .github/scripts/update_repo.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- repo.json; then
            echo "No repo.json changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "chore: update repo.json from package.json"
          git push
